version: '3.8'

services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      # Example of how the app would connect to postgres, even though the current API just serves predictions
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=maintenance
    volumes:
      # Mount the trained model so it's available without being baked into the image
      - ./predictive_maintenance_model.pkl:/app/predictive_maintenance_model.pkl:ro
      - ./predictive_maintenance_model_features.json:/app/predictive_maintenance_model_features.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=maintenance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
